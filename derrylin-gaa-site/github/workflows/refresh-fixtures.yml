name: Refresh fixtures

# Pulls Derrylin O'Connells fixtures & results from fermanagh.gaa.ie and
# commits them to docs/ when anything changes. GitHub Pages then republishes.
on:
  schedule:
    - cron: "7 */2 * * 1-4"        # Mon–Thu: every 2 hours
    - cron: "7,37 * * * 0,5,6"     # Fri–Sun: every 30 minutes (match days)
  workflow_dispatch: {}             # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-fixtures
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet requests beautifulsoup4

      - name: Fetch and build
        run: python scraper/scrape.py

      - name: Commit changes
        run: |
          git config user.name "fixtures-bot"
          git config user.email "fixtures-bot@users.noreply.github.com"
          git add docs/data docs/*.ics
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Refresh fixtures from Fermanagh GAA"
            git push
          fi
